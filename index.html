<!doctype html><html lang="vi"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Sạp Online</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style id="app-style">
/* Layout: market-stall storefront. Sticky header, one bold turmeric promo banner, quiet product grid; seller console in tabs; cart as a right drawer. */
:root{
  --bg:#F3F5F1;--surface:#FFFFFF;--sunk:#E8EDE7;--ink:#13201B;--muted:#5A6962;--line:#D6DED8;
  --leaf:#0C6A4F;--leaf-hover:#09573F;--leaf-ink:#FFFFFF;--leaf-soft:#DBEEE5;
  --tag:#C62219;--tag-hover:#A81B13;--tag-ink:#FFFFFF;
  --promo-bg:#F2B705;--promo-ink:#231A00;--promo-muted:#5A4500;
  --hot-bg:#FDEFC2;--hot-ink:#6B4F00;--ok-bg:#DDF1E6;--ok-ink:#17643D;--info-bg:#E0E8F6;--info-ink:#2D4B80;
  --bad-bg:#FBE2DF;--bad-ink:#A0241B;--mute-bg:#ECEFEC;--mute-ink:#5A6962;
  --ph1-bg:#DBEEE5;--ph1-fg:#0C6A4F;--ph2-bg:#FDEFC2;--ph2-fg:#7A5900;--ph3-bg:#FBE2DF;--ph3-fg:#A0241B;
  --ph4-bg:#E0E8F6;--ph4-fg:#2D4B80;--ph5-bg:#EEE6D8;--ph5-fg:#6A4C27;
  --scrim:rgb(10 20 16 / .48);
  --shadow:0 1px 2px rgb(19 32 27 / .06),0 10px 30px rgb(19 32 27 / .10);
  --f-display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-md:14px;--r-lg:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1311;--surface:#151D1A;--sunk:#1D2824;--ink:#E5EDE8;--muted:#95A49D;--line:#283631;
  --leaf:#3DBA90;--leaf-hover:#55CBA2;--leaf-ink:#05231A;--leaf-soft:#163A2E;
  --tag:#FF6B5D;--tag-hover:#FF8579;--tag-ink:#2A0603;
  --promo-bg:#2C2511;--promo-ink:#FBE6A2;--promo-muted:#CDB878;
  --hot-bg:#3A3112;--hot-ink:#F6D676;--ok-bg:#163A2A;--ok-ink:#7FDDAF;--info-bg:#1B2840;--info-ink:#A2BDEB;
  --bad-bg:#3D1D1A;--bad-ink:#FF9E93;--mute-bg:#212B27;--mute-ink:#95A49D;
  --ph1-bg:#163A2E;--ph1-fg:#86E2BF;--ph2-bg:#3A3112;--ph2-fg:#F6D676;--ph3-bg:#3D1D1A;--ph3-fg:#FF9E93;
  --ph4-bg:#1B2840;--ph4-fg:#A2BDEB;--ph5-bg:#33291B;--ph5-fg:#DFC39B;
  --scrim:rgb(0 0 0 / .62);--shadow:0 1px 2px rgb(0 0 0 / .3),0 10px 30px rgb(0 0 0 / .35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1311;--surface:#151D1A;--sunk:#1D2824;--ink:#E5EDE8;--muted:#95A49D;--line:#283631;
  --leaf:#3DBA90;--leaf-hover:#55CBA2;--leaf-ink:#05231A;--leaf-soft:#163A2E;
  --tag:#FF6B5D;--tag-hover:#FF8579;--tag-ink:#2A0603;
  --promo-bg:#2C2511;--promo-ink:#FBE6A2;--promo-muted:#CDB878;
  --hot-bg:#3A3112;--hot-ink:#F6D676;--ok-bg:#163A2A;--ok-ink:#7FDDAF;--info-bg:#1B2840;--info-ink:#A2BDEB;
  --bad-bg:#3D1D1A;--bad-ink:#FF9E93;--mute-bg:#212B27;--mute-ink:#95A49D;
  --ph1-bg:#163A2E;--ph1-fg:#86E2BF;--ph2-bg:#3A3112;--ph2-fg:#F6D676;--ph3-bg:#3D1D1A;--ph3-fg:#FF9E93;
  --ph4-bg:#1B2840;--ph4-fg:#A2BDEB;--ph5-bg:#33291B;--ph5-fg:#DFC39B;
  --scrim:rgb(0 0 0 / .62);--shadow:0 1px 2px rgb(0 0 0 / .3),0 10px 30px rgb(0 0 0 / .35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--bg)}
html.lock,html.lock body{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
button:disabled{cursor:not-allowed}
a{color:var(--leaf)}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.wrap{width:100%;max-width:1200px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:800;line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.hint{color:var(--muted);font-size:13px;line-height:1.5}
.price{color:var(--tag);font-weight:700;font-variant-numeric:tabular-nums}
s{color:var(--muted);font-variant-numeric:tabular-nums}
.sel{user-select:all}
.eyebrow-s{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--leaf);font-weight:700}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px;line-height:1.2;background:var(--sunk);color:var(--ink);text-decoration:none;white-space:nowrap;transition:background-color .15s,border-color .15s,color .15s,transform .1s}
.btn:hover{border-color:var(--muted)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45}
.btn-leaf{background:var(--leaf);color:var(--leaf-ink)}
.btn-leaf:hover{background:var(--leaf-hover);border-color:transparent}
.btn-tag{background:var(--tag);color:var(--tag-ink)}
.btn-tag:hover{background:var(--tag-hover);border-color:transparent}
.btn-ghost{background:transparent;border-color:var(--line)}
.btn-sm{padding:7px 12px;font-size:13px;gap:6px}
.btn-sm .ico{width:16px;height:16px}
.btn-lg{padding:14px 20px;font-size:15px}
.btn-icon{padding:8px;border-radius:12px}
.btn-block{width:100%}
.btn-danger:hover{color:var(--bad-ink);border-color:var(--bad-ink)}
.btn-dark{background:var(--promo-ink);color:var(--promo-bg)}
.btn-dark:hover{border-color:transparent;opacity:.9}
.btn-promo-ghost{background:transparent;color:var(--promo-ink);border-color:color-mix(in srgb,var(--promo-ink) 35%,transparent)}
.btn-promo-ghost:hover{border-color:var(--promo-ink)}
.btn-promo-link{background:transparent;color:var(--promo-ink);text-decoration:underline;text-underline-offset:3px;padding-inline:6px}
.btn-promo-link:hover{border-color:transparent}
.linkbtn{color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.linkbtn:hover{color:var(--ink)}

/* seller strip + announcement bar */
.strip{background:var(--ink);color:var(--bg);font-size:13px}
.strip .wrap{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding-block:7px}
.strip-text{flex:1 1 220px;min-width:0}
.seg{display:inline-flex;background:color-mix(in srgb,var(--bg) 16%,transparent);border-radius:999px;padding:3px}
.seg button{padding:5px 14px;border-radius:999px;font-weight:600;color:inherit}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink)}
.strip-link{color:inherit;text-decoration:underline;font-weight:600}
.adbar{background:var(--leaf);color:var(--leaf-ink);font-size:13.5px;font-weight:500}
.adbar .wrap{padding-block:8px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.adbar .ico{width:16px;height:16px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:saturate(1.2) blur(10px);backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px 20px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand-mark{width:40px;height:40px;flex:none;border-radius:12px;background:var(--leaf);color:var(--leaf-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px}
.brand-text{display:grid;line-height:1.2;min-width:0}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-slogan{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px;max-width:520px;width:100%;justify-self:center;color:var(--muted)}
.search:focus-within{border-color:var(--leaf);box-shadow:0 0 0 3px var(--leaf-soft)}
.search input{border:0;background:transparent;outline:0;padding:10px 0;width:100%;min-width:0;color:var(--ink)}
.cart-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600}
.cart-count{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--tag);color:var(--tag-ink);font-size:12px;font-weight:700;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
@media (max-width:720px){
  .top-in{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand cart" "search search";padding-block:10px}
  .brand{grid-area:brand}.cart-btn{grid-area:cart;padding:9px 14px}.search{grid-area:search;max-width:none}
  .cart-label{display:none}
}

/* shop */
.shop{display:grid;gap:28px;padding-block:20px 56px}
.promo{background:var(--promo-bg);color:var(--promo-ink);border-radius:var(--r-lg);overflow:hidden;position:relative}
.promo-card{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);min-height:320px}
.promo-copy{padding:clamp(22px,4vw,44px);display:flex;flex-direction:column;gap:14px;justify-content:center;min-width:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--promo-muted)}
.promo-head{font-size:clamp(30px,4.6vw,56px);line-height:1;letter-spacing:-.025em}
.promo-name{font-size:16px;font-weight:600}
.promo-price{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.promo-price b{font-family:var(--f-display);font-size:clamp(26px,3vw,34px);font-weight:800;font-variant-numeric:tabular-nums}
.promo-price s{color:var(--promo-muted);font-size:16px}
.promo-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:4px}
.promo-media{display:block;position:relative;width:100%;min-height:260px;overflow:hidden;container-type:inline-size;background:var(--sunk)}
.promo-media img,.promo-media .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.promo-media .ph{padding:24px}
.promo-media .ph-word{font-size:32px;font-size:clamp(28px,10cqi,60px)}
.sticker{position:absolute;top:18px;left:18px;width:84px;height:84px;border-radius:50%;background:var(--tag);color:var(--tag-ink);display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1;transform:rotate(-10deg);box-shadow:0 6px 18px rgb(0 0 0 / .2)}
.sticker small{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.promo-nav{position:absolute;right:16px;bottom:14px;display:flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--promo-bg) 82%,transparent);padding:4px;border-radius:999px}
.nav-btn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--promo-ink)}
.nav-btn:hover{background:color-mix(in srgb,var(--promo-ink) 10%,transparent)}
.dot{width:8px;height:8px;border-radius:99px;background:color-mix(in srgb,var(--promo-ink) 30%,transparent);transition:width .2s}
.dot[aria-current="true"]{width:22px;background:var(--promo-ink)}
@media (max-width:720px){
  .promo-card{grid-template-columns:1fr;min-height:0}
  .promo-media{order:-1;min-height:0;aspect-ratio:16/10;max-width:100%}
  .promo-nav{position:static;justify-content:flex-start;margin:0 18px 18px;width:max-content}
}
.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--line)}
.intro h1{font-size:clamp(32px,5vw,56px);letter-spacing:-.025em}
.intro-sub{font-size:17px;margin-top:6px}

.catalog{display:grid;gap:16px}
.catalog-head{display:flex;align-items:flex-end;gap:10px 16px;flex-wrap:wrap}
.catalog-head h2{font-size:26px}
.result-count{color:var(--muted);font-size:14px;margin-right:auto}
.select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;white-space:nowrap}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{opacity:.6;margin-left:6px;font-variant-numeric:tabular-nums}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:16px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.card-media{position:relative;display:block;width:100%;max-width:100%;aspect-ratio:1/1;background:var(--sunk);overflow:hidden;container-type:inline-size}
.card-media img{width:100%;height:100%;object-fit:cover;display:block}
.card-media .ph{position:absolute;inset:0}
.badges{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.badge{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.02em;line-height:1.4}
.badge-hot{background:var(--promo-bg);color:var(--promo-ink)}
.badge-off{background:var(--tag);color:var(--tag-ink)}
.badge-out{background:var(--ink);color:var(--bg)}
.badge-sample{background:var(--surface);color:var(--muted);border:1px dashed var(--muted)}
.card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.card-cat{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.card-name{font-family:var(--f-body);font-weight:600;font-size:15px;line-height:1.35;letter-spacing:0}
.card-name button{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:left}
.card-name button:hover{color:var(--leaf)}
.price-row{display:flex;align-items:baseline;gap:4px 8px;flex-wrap:wrap}
.price-row .price{font-size:17px}
.price-row s{font-size:13px}
.card-actions{display:flex;gap:8px;margin-top:auto;padding-top:6px}
.card-actions .btn-buy{flex:1;min-width:0}
@media (max-width:520px){.card-body{padding:10px 10px 12px}.card-name{font-size:14px}}

/* placeholder art for products without a photo */
.ph{display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:14px;background-color:var(--phb);color:var(--phf);background-image:repeating-linear-gradient(135deg,color-mix(in srgb,currentColor 9%,transparent) 0 1.5px,transparent 1.5px 11px);overflow:hidden;text-align:left}
.ph1{--phb:var(--ph1-bg);--phf:var(--ph1-fg)}.ph2{--phb:var(--ph2-bg);--phf:var(--ph2-fg)}.ph3{--phb:var(--ph3-bg);--phf:var(--ph3-fg)}.ph4{--phb:var(--ph4-bg);--phf:var(--ph4-fg)}.ph5{--phb:var(--ph5-bg);--phf:var(--ph5-fg)}
.ph-cat{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85;align-self:flex-end}
.ph-word{font-family:var(--f-display);font-weight:800;font-size:22px;font-size:clamp(17px,12cqi,40px);line-height:1;letter-spacing:-.02em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ph-mini{width:100%;height:100%;display:grid;place-items:center;padding:0;font-family:var(--f-display);font-weight:800;font-size:20px}

/* product detail */
.pd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.pd-media{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:var(--r-md);overflow:hidden;background:var(--sunk);container-type:inline-size}
.pd-media img{width:100%;height:100%;object-fit:cover;display:block}
.pd-media .ph{position:absolute;inset:0;padding:22px}
.pd-info{display:flex;flex-direction:column;gap:12px;min-width:0;padding-top:4px}
.pd-name{font-size:clamp(22px,3vw,30px);padding-right:36px}
.pd-price .price{font-size:26px;font-family:var(--f-display);font-weight:800}
.pd-stock{font-size:14px;color:var(--ok-ink);font-weight:600}
.pd-stock.out{color:var(--bad-ink)}
.pd-desc{white-space:pre-line;line-height:1.65;max-width:62ch}
.pd-buy{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-top:4px}
.pd-perks{list-style:none;margin:6px 0 0;padding:12px 0 0;border-top:1px solid var(--line);display:grid;gap:8px;font-size:14px;color:var(--muted)}
.pd-perks li{display:flex;gap:8px;align-items:flex-start}
@media (max-width:640px){.pd{grid-template-columns:1fr;gap:16px}.pd-media{aspect-ratio:4/3}}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.stepper button{width:38px;height:38px;display:grid;place-items:center;border-radius:999px}
.stepper button:hover:not(:disabled){background:var(--sunk)}
.stepper button:disabled{opacity:.35}
.stepper output,.stepper .qty{min-width:28px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.stepper.sm button{width:30px;height:30px}
.stepper.sm .ico{width:15px;height:15px}

/* modal */
.modal-scrim{position:fixed;inset:0;z-index:70;background:var(--scrim);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.modal{position:relative;background:var(--surface);color:var(--ink);border-radius:var(--r-lg);width:min(100%,620px);max-height:100%;overflow:auto;padding:22px;box-shadow:var(--shadow)}
.modal-wide{width:min(100%,900px)}
.modal-x{position:absolute;top:12px;right:12px;z-index:2;background:var(--surface)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal-head h2{font-size:22px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;padding-top:4px}
@media (max-width:560px){
  .modal-scrim{place-items:end center;padding:env(safe-area-inset-top,0px) 0 0}
  .modal{border-radius:22px 22px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:94%}
}

/* forms */
.form{display:grid;gap:16px}
.field{display:grid;gap:6px;min-width:0}
.field>label,.label{font-size:13px;font-weight:600}

function categories(list) { const m = new Map(); list.forEach(p => { const c = String(p.category || '').trim(); if (c) m.set(c, (m.get(c) || 0) + 1); }); return [...m.entries()]; }

function sanitizeCart(c) { const out = {}; if (c && typeof c === 'object') for (const k in c) { const q = Math.round(num(c[k])); if (q > 0) out[k] = Math.min(q, 999); } return out; }

}

function totals() {
  const lines = cartLines(); const st = D().store;
  const subtotal = lines.reduce((s, l) => s + num(l.p.price) * l.qty, 0);
  const free = num(st.freeShipFrom) > 0 && subtotal >= num(st.freeShipFrom);

}

}
function copyText(text, okMsg) {

async function resizeImage(file) {
  if (!file || !/^image\//.test(file.type)) throw new Error('type');
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 720; const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * scale)), h = Math.max(1, Math.round(img.naturalHeight * scale));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
    return c.toDataURL('image/jpeg', 0.8);
  } finally { URL.revokeObjectURL(url); }
}
async function handleImage(input) {
  const file = input.files && input.files[0]; if (!file) return;
  const prev = $('#pf-preview');
  try {
    prev.classList.add('loading');
    formImg = await resizeImage(file);
    prev.innerHTML = `<img src="${formImg}" alt="Ảnh sản phẩm">`;
    $('#pf-img-remove').hidden = false; $('#pf-file-label span').textContent = 'Đổi ảnh';
  } catch (e) { toast('Không đọc được ảnh này. Hãy chọn file JPG hoặc PNG khác.'); }
  finally { prev.classList.remove('loading'); input.value = ''; }
}

    <div class="modal-head"><h2>Đẩy quảng cáo</h2><button type="button" class="btn btn-ghost btn-icon" data-action="modal-close" aria-label="Đóng">${I.x}</button></div>
    <div class="promo-target"><div class="prow-thumb">${thumb(p)}</div><div><b>${esc(p.name)}</b><div class="price-row"><span class="price">${fmt(p.price)}</span>${off ? `<s>${fmt(p.oldPrice)}</s>` : ''}</div></div></div>
    <div class="field"><label for="pm-headline">Tiêu đề trên banner</label><input id="pm-headline" name="headline" maxlength="70" value="${esc(pr.headline || '')}" placeholder="VD: Giảm 20% cuối tuần này" data-autofocus><p class="hint">Ngắn gọn, nêu lợi ích. Để trống sẽ dùng tên sản phẩm.</p></div>
    <div class="field"><label for="pm-until">Chạy đến hết ngày</label><input id="pm-until" name="until" type="date" min="${today()}" value="${until}"></div>
    <label class="switch"><input type="checkbox" name="on" checked><span class="track" aria-hidden="true"></span><span>Hiện trên banner đầu trang</span></label>
    <div class="notice">Sản phẩm sẽ hiện ở banner lớn đầu trang, gắn nhãn “Nổi bật” và được xếp lên đầu danh sách cho tới hết ngày bạn chọn.${off ? '' : ' Muốn hiện nhãn giảm giá, hãy nhập Giá gốc cao hơn Giá bán trong phần Sửa sản phẩm.'}</div>
    ${p.hidden ? '<p class="form-error">Sản phẩm đang ẩn nên sẽ không hiện trên banner. Hãy bật hiển thị trong tab Sản phẩm.</p>' : ''}
    <p class="form-error" id="pm-error" role="alert" hidden></p>
    <div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="modal-close">Huỷ</button><button type="submit" class="btn btn-leaf">${I.mega}<span>Lưu quảng cáo</span></button></div>
  </form>`, { label: 'Đẩy quảng cáo' });
}
function savePromo(form) {
  const id = form.dataset.id; const headline = String(form.elements.headline.value || '').trim().slice(0, 70);
  const until = /^\d{4}-\d{2}-\d{2}$/.test(form.elements.until.value) ? form.elements.until.value : '';
  const on = form.elements.on.checked;
  if (on && until && until < today()) { const e = $('#pm-error'); e.textContent = 'Ngày kết thúc phải từ hôm nay trở đi.'; e.hidden = false; return; }
  edit(d => { const p = d.products.find(x => x.id === id); if (p) p.promo = { on, headline, until }; });
  closeModal();
  toast(on ? 'Đã đẩy sản phẩm lên banner trong bản nháp.' : 'Đã tắt quảng cáo trong bản nháp.', { label: ENV.standalone ? 'Lưu ngay' : 'Đăng ngay', action: 'publish' });
}
function postTemplate(p) {
  const s = D().store; const off = discountPct(p); const pr = p.promo || {};
  const L = ['🔥 ' + (pr.headline || p.name), ''];
  L.push(p.name + (off ? ` chỉ còn ${fmt(p.price)} (giá gốc ${fmt(p.oldPrice)}, giảm ${off}%).` : ` giá ${fmt(p.price)}.`));
  if (p.desc) L.push(trunc(p.desc.replace(/\s+/g, ' '), 220));
  L.push('', '✅ Kiểm tra hàng rồi mới thanh toán');
  if (num(s.freeShipFrom)) L.push('🚚 Miễn phí giao hàng cho đơn từ ' + fmt(s.freeShipFrom));
  if (s.phone) L.push('📞 Đặt hàng qua Zalo: ' + prettyPhone(s.phone));
  if (pr.on && pr.until) L.push('⏰ Ưu đãi đến hết ngày ' + ddmmyyyy(pr.until));
  L.push('', [s.name, p.category].filter(Boolean).map(hashtag).join(' '));
  return L.join('\n');
}
function openPostModal(p) {
  if (!p) return;
  openModal(`<div class="form">
    <div class="modal-head"><h2>Bài đăng quảng cáo</h2><button type="button" class="btn btn-ghost btn-icon" data-action="modal-close" aria-label="Đóng">${I.x}</button></div>
    <p class="muted">Sao chép rồi đăng lên Facebook, Zalo hoặc các nhóm mua bán, kèm ảnh sản phẩm. Bạn có thể sửa trực tiếp trong khung dưới.</p>
    <div class="field"><label for="post-text">Nội dung</label><textarea id="post-text" rows="11" data-autofocus>${esc(postTemplate(p))}</textarea></div>
    <div class="modal-foot">${ENV.sample ? `<button type="button" class="btn btn-ghost" data-action="post-ai" data-id="${esc(p.id)}">${I.sparkle}<span>Viết bằng AI</span></button>` : ''}<button type="button" class="btn btn-leaf" data-action="copy" data-target="#post-text" data-ok="Đã sao chép bài đăng">${I.copy}<span>Sao chép bài đăng</span></button></div>
  </div>`, { label: 'Bài đăng quảng cáo' });
}
async function aiPost(id, btn) {
  const p = findP(id); const ta = $('#post-text'); if (!p || !ENV.sample || !ta) return;
  const label = btn.querySelector('span'); btn.disabled = true; label.textContent = 'Đang viết…';
  const s = D().store; const off = discountPct(p); const pr = p.promo || {};
  const prompt = [
    'Viết một bài đăng bán hàng bằng tiếng Việt để đăng Facebook hoặc Zalo cho một cửa hàng nhỏ.',
    'Yêu cầu: 60 đến 110 từ, giọng thân thiện tự nhiên, dùng 2 đến 4 emoji, ghi giá bằng ₫, kết thúc bằng lời mời đặt hàng. Không bịa thông tin ngoài dữ liệu dưới đây. Chỉ trả về nội dung bài đăng, không thêm lời dẫn.',
    'Cửa hàng: ' + s.name, 'Sản phẩm: ' + p.name, 'Danh mục: ' + (p.category || 'không rõ'), 'Giá bán: ' + fmt(p.price),
    off ? 'Giá gốc: ' + fmt(p.oldPrice) + ' (giảm ' + off + '%)' : '', p.desc ? 'Mô tả: ' + p.desc : '',
    pr.headline ? 'Tiêu đề quảng cáo: ' + pr.headline : '', pr.on && pr.until ? 'Ưu đãi đến hết ngày: ' + ddmmyyyy(pr.until) : '',
    s.phone ? 'Số Zalo đặt hàng: ' + prettyPhone(s.phone) : '', num(s.freeShipFrom) ? 'Miễn phí giao hàng cho đơn từ ' + fmt(s.freeShipFrom) : ''
  ].filter(Boolean).join('\n');
  try {
    const r = await ENV.sample(prompt, { modelTier: 'quick', cache: false, onText: o => { if (ta.isConnected && o && o.text) ta.value = o.text; } });
    if (ta.isConnected && r && r.text) ta.value = r.text.trim();
  } catch (e) {
    const c = e && e.code;
    toast(c === 'rate_limited' ? 'AI đang bận, thử lại sau ít phút.' : c === 'not_granted' ? 'Trang chưa được phép dùng AI. Bạn vẫn dùng được bài mẫu.' : 'Chưa viết được bằng AI. Bạn vẫn dùng được bài mẫu.');
    if (c === 'not_granted') ENV.sample = null;
  }
  if (btn.isConnected) { btn.disabled = false; label.textContent = 'Viết lại bằng AI'; if (!ENV.sample) btn.remove(); }
}

/* ---------- publish & export ---------- */
function buildDocument(state) {
  const headStyle = document.head && document.head.querySelector('style');
  const reset = headStyle ? headStyle.textContent : RESET_FALLBACK;
  const json = JSON.stringify(state).replace(/</g, '\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>' +
    '<title>' + PAGE_TITLE + '</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n' +
    '<link rel="stylesheet" href="' + FONT_HREF + '">\n' +
    '<style id="app-style">' + STYLE_TEXT + '</style>\n' +
    '<div id="app"></div>\n' +
    '<script type="application/json" id="store-data">' + json + '<\/script>\n' +
    '<script id="app-script">' + SCRIPT_TEXT + '<\/script>' +
    '</body></html>';
}
async function publish() {
  if (!draft || ui.publishing) return;
  const next = clone(draft); next.rev = published.rev + 1; next.updatedAt = Date.now();
  if (ENV.standalone) {
    if (!LS.set('published', next)) { toast('Trình duyệt hết chỗ lưu. Hãy tải file HTML ngay để giữ thay đổi.', { label: 'Tải file', action: 'export' }); return; }
    published = next; draft = null; draftCount = 0; LS.del('draft'); render();
    toast('Đã lưu. Tải file HTML rồi đưa lên hosting để khách thấy bản mới.', { label: 'Tải file', action: 'export' });
    return;
  }
  if (!ENV.artifact) return;
  ui.publishing = true; renderPubbar();
  SS.set('view', ui.view); SS.set('tab', ui.tab); SS.set('publishing', published.rev); SS.set('justPublished', true);
  try { await ENV.artifact.publish(buildDocument(next)); }
  catch (e) {
    ui.publishing = false; SS.del('justPublished'); SS.del('publishing');
    const c = e && e.code;
    if (c === 'conflict') toast('Cửa hàng vừa được cập nhật ở nơi khác. Trang đang tải lại bản mới nhất.');
    else if (['not_writer', 'not_granted', 'not_declared', 'consent_required', 'capability_disabled', 'capability_removed'].includes(c)) { toast('Bạn chỉ có quyền xem trang này nên không đăng được thay đổi.'); ENV.isSeller = false; render(); return; }
    else if (c === 'too_large') toast('Cửa hàng quá lớn để đăng. Hãy xoá bớt ảnh hoặc sản phẩm.');
    else if (c === 'rate_limited') toast('Bạn vừa đăng liên tục. Đợi một chút rồi thử lại.');
    else toast('Chưa đăng được do lỗi kết nối. Thử lại sau ít phút.');
    renderPubbar();
  }
}
async function exportHtml() {
  const html = buildDocument(Object.assign(clone(D()), { rev: D().rev }));
  const filename = slug(D().store.name) + '.html';
  if (ENV.downloads) {
    try { await ENV.downloads.save({ filename, data: new Blob([html], { type: 'text/html' }) }); toast('Đã tải file ' + filename); }
    catch (e) { if (e && e.code === 'declined') return; toast('Trình xem này chưa cho tải file. Hãy nhờ Claude gửi file HTML cho bạn.'); }
    return;
  }
  if (ENV.standalone) {
    const url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('Đã tải file ' + filename);
    return;
  }
  toast('Trình xem này chưa cho tải file. Hãy nhờ Claude gửi file HTML cho bạn.');
}
function renderPubbar() {
  const el = $('#pubbar'); const show = ENV.isSeller && !!draft;
  document.body.classList.toggle('has-pubbar', show);
  if (!show) { el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  el.innerHTML = `<div class="wrap"><div class="pubbar-text"><b>${draftCount} thay đổi chưa đăng.</b> ${ENV.standalone ? 'Bấm Lưu, rồi tải file HTML để cập nhật website.' : 'Khách sẽ thấy sau khi bạn bấm Đăng.'}</div>
    <button type="button" class="btn btn-ghost btn-sm" data-action="discard">${ui.confirm === 'discard' ? 'Bấm lần nữa để bỏ' : 'Bỏ thay đổi'}</button>
    <button type="button" class="btn btn-leaf" data-action="publish"${ui.publishing ? ' disabled' : ''}>${ui.publishing ? 'Đang đăng…' : (ENV.standalone ? 'Lưu thay đổi' : 'Đăng lên cửa hàng')}</button></div>`;
}

/* ---------- interactions ---------- */
function arm(key, rerender) {
  ui.confirm = key; rerender(); clearTimeout(confirmTimer);
  confirmTimer = setTimeout(() => { if (ui.confirm === key) { ui.confirm = null; rerender(); } }, 4000);
}
function scrollTop() { try { window.scrollTo({ top: 0 }); } catch (e) { window.scrollTo(0, 0); } }
function setView(v) { ui.view = v; SS.set('view', v); closeModal(); render(); scrollTop(); }
function enterSellerStandalone() { if (!ENV.standalone) return; ENV.isSeller = true; SS.set('seller', true); loadDraft(); ui.view = SS.get('view') || 'seller'; render(); scrollTop(); }

document.addEventListener('click', e => {
  const scrim = e.target.closest('.modal-scrim'); if (scrim && e.target === scrim) { closeModal(); return; }
  const a = e.target.closest('[data-action]'); if (!a || a.disabled) return;
  const id = a.dataset.id; const act = a.dataset.action;
  if (a.dataset.src === 'ad' && id) recordAdClick(id);
  switch (act) {
    case 'go-shop': e.preventDefault(); setView('shop'); break;
    case 'go-seller': setView('seller'); break;
    case 'tab': ui.tab = a.dataset.tab; SS.set('tab', ui.tab); ui.confirm = null; $('#tabs').innerHTML = tabs(); renderPanel(); break;
    case 'exit-seller': SS.del('seller'); ENV.isSeller = false; ui.view = 'shop'; if (location.hash === '#quan-ly') { try { history.replaceState(null, '', location.pathname + location.search); } catch (err) {} } render(); break;
    case 'seller-enter': enterSellerStandalone(); break;
    case 'open-cart': closeModal(); openDrawer('cart'); break;
    case 'close-drawer': closeDrawer(); break;
    case 'continue': closeDrawer(); break;
    case 'add': addToCart(id, 1); break;
    case 'buy-now': addToCart(id, 1, 'checkout'); break;
    case 'view': openProduct(id); break;
    case 'mqty': { const p = findP(id); if (!p) break; ui.mqty = Math.max(1, Math.min(maxQty(p), ui.mqty + Number(a.dataset.d))); $('#mqty').textContent = ui.mqty; break; }
    case 'modal-add': { const q = ui.mqty; closeModal(); addToCart(id, q); break; }
    case 'modal-buy': addToCart(id, ui.mqty, 'checkout'); break;
    case 'modal-close': closeModal(); break;
    case 'cart-inc': { const p = findP(id); if (p) { cart[id] = Math.min((cart[id] || 0) + 1, maxQty(p)); saveCart(); renderDrawer(); updateHeader(); } break; }
    case 'cart-dec': { cart[id] = (cart[id] || 0) - 1; if (cart[id] <= 0) delete cart[id]; saveCart(); renderDrawer(); updateHeader(); break; }
    case 'cart-remove': delete cart[id]; saveCart(); renderDrawer(); updateHeader(); break;
    case 'to-checkout': ui.step = 'checkout'; renderDrawer(); setTimeout(() => { const f = $('#co-name'); if (f) f.focus({ preventScroll: true }); }, 30); break;
    case 'back-cart': ui.step = 'cart'; renderDrawer(); break;
    case 'slide': { const n = activePromos().length; if (n) { ui.slide = (ui.slide + Number(a.dataset.d) + n) % n; renderPromo(); const b = $(`#promo [data-action="slide"][data-d="${a.dataset.d}"]`); if (b) b.focus(); } break; }
    case 'slide-go': ui.slide = Number(a.dataset.i) || 0; renderPromo(); break;
    case 'cat': ui.cat = a.dataset.cat; renderCatalog(); break;
    case 'clear-search': ui.q = ''; $('#q').value = ''; renderCatalog(); break;
    case 'copy': { const t = a.dataset.target ? $(a.dataset.target) : null; const text = t ? ('value' in t ? t.value : t.textContent) : (a.dataset.text || ''); copyText(text, a.dataset.ok); break; }
    case 'new-product': openProductForm(null); break;
    case 'edit-product': openProductForm(findP(id)); break;
    case 'toggle-hidden': edit(d => { const p = d.products.find(x => x.id === id); if (p) p.hidden = !p.hidden; }); break;
    case 'del-product':
      if (ui.confirm === 'del:' + id) { ui.confirm = null; edit(d => { d.products = d.products.filter(p => p.id !== id); }); toast('Đã xoá sản phẩm trong bản nháp.'); }
      else arm('del:' + id, renderPanel);
      break;
    case 'del-samples':
      if (ui.confirm === 'samples') { ui.confirm = null; edit(d => { d.products = d.products.filter(p => !p.sample); }); toast('Đã xoá các sản phẩm mẫu trong bản nháp.'); }
      else arm('samples', renderPanel);
      break;
    case 'promo-edit': openPromoForm(findP(id)); break;
    case 'promo-stop': edit(d => { const p = d.products.find(x => x.id === id); if (p && p.promo) p.promo.on = false; }); toast('Đã dừng quảng cáo trong bản nháp.'); break;
    case 'post-gen': openPostModal(findP(id)); break;
    case 'post-ai': aiPost(id, a); break;
    case 'img-remove': formImg = ''; $('#pf-preview').innerHTML = `<div class="pf-empty">${I.image}<span>Chưa có ảnh</span></div>`; a.hidden = true; $('#pf-file-label span').textContent = 'Chọn ảnh'; break;
    case 'publish': publish(); break;
    case 'discard': if (ui.confirm === 'discard') discardDraft(); else arm('discard', renderPubbar); break;
    case 'export': exportHtml(); break;
    case 'ofilter': ui.ofilter = a.dataset.st; renderPanel(); break;
    case 'order-copy': { const o = orders.find(x => x.code === a.dataset.code); if (o) copyText(orderText(o), 'Đã sao chép đơn ' + o.code); break; }
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { ui.q = t.value; if (ui.view !== 'shop') { ui.view = 'shop'; SS.set('view', 'shop'); renderStrip(); renderMain(); } else renderCatalog(); return; }
  const f = t.closest('.field.invalid'); if (f) { f.classList.remove('invalid'); const er = f.querySelector('.ferr'); if (er) er.hidden = true; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'sort') { ui.sort = t.value; renderCatalog(); return; }
  if (t.id === 'pf-file') { handleImage(t); return; }
  if (t.matches('[data-status-code]')) { setStatus(t.dataset.statusCode, t.value); return; }
  if (t.id === 'bar-on') { const lbl = t.parentElement.querySelector('span:last-child'); if (lbl) lbl.textContent = t.checked ? 'Đang bật' : 'Đang tắt'; edit(d => { d.bar.on = t.checked; }, { silent: true }); return; }
  if (t.id === 'bar-text') { const val = t.value.trim().slice(0, 140); edit(d => { d.bar.text = val; }, { silent: true }); return; }
  if (t.matches('[data-set]')) {
    const k = t.dataset.set; let val;
    if (t.dataset.num) { val = parseMoney(t.value); t.value = val ? fmtNum(val) : ''; }
    else { val = t.value.trim(); if (k === 'facebook') val = fbHandle(val); if (k === 'phone') val = val.slice(0, 20); if (k === 'name' && !val) val = PAGE_TITLE; t.value = val; }
    if (D().store[k] === val) return;
    edit(d => { d.store[k] = val; }, { silent: true });
  }
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.id === 'product-form') saveProductForm(f);
  else if (f.id === 'promo-form') savePromo(f);
  else if (f.id === 'checkout-form') submitOrder(f);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (ui.modal) closeModal(); else if (ui.drawer) closeDrawer();
});
document.addEventListener('pointerover', e => { promoHover = !!e.target.closest('#promo'); });
document.addEventListener('focusin', e => { promoHover = !!e.target.closest('#promo'); });
window.addEventListener('hashchange', () => { if (ENV.standalone && location.hash === '#quan-ly' && !ENV.isSeller) enterSellerStandalone(); });
setInterval(() => {
  if (document.hidden || ui.view !== 'shop' || ui.drawer || ui.modal || promoHover) return;
  try { if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch (e) {}
  const n = activePromos().length; if (n < 2) return;
  ui.slide = (ui.slide + 1) % n; renderPromo();
}, 7000);

/* ---------- boot ---------- */
async function initClaude() {
  for (let i = 0; i < 30 && !hasClaude(); i++) await new Promise(r => setTimeout(r, 100));
  if (!hasClaude()) return;
  const use = n => Promise.resolve().then(() => window.claude.use(n)).catch(() => null);
  const [user, artifact, db, downloads, sample] = await Promise.all(['user', 'artifact', 'db', 'downloads', 'sample'].map(use));
  Object.assign(ENV, { user, artifact, db, downloads, sample });
  if (user) { try { ENV.uid = await user.id(); } catch (e) {} }
  let canEdit = false; if (user) { try { canEdit = await user.canEdit(); } catch (e) {} }
  ENV.isSeller = !!(artifact && canEdit);
  if (ENV.isSeller) {
    loadDraft();
    if (SS.get('view') === 'seller') ui.view = 'seller';
    if (SS.get('justPublished')) { SS.del('justPublished'); setTimeout(() => toast('Đã đăng lên cửa hàng. Khách mở trang sẽ thấy bản mới.'), 300); }
    subscribeSellerData();
  }
  render();
}
buildShell();
render();
if (ENV.inClaude) initClaude();
else if (location.hash === '#quan-ly' || SS.get('seller')) enterSellerStandalone();
})();
</script>
</body></html>
